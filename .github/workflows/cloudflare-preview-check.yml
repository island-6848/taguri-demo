name: Check Cloudflare migration preview
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      # build_recommend_index.py must keep matching the Python recommender
      - 'tools/review/user_recommender.py'
      - 'tools/review/measure_nets.py'
      - 'tools/review/recommend2.py'
      - 'tools/taguri/app.py'
      # the local admin tool writes the tables the Worker reads (stage_override, admin_log)
      - 'tools/admin/**'
      - '.github/workflows/cloudflare-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # lockfile で npm の取り込みを控える（2 回目からは取り込みが速くなるので、下の検査を足しても分はほぼ増えない）
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # lockfile のとおりに入れる（同じコミットなら同じ部品。issue #131）
      - run: npm ci --no-audit --no-fund
      # 配信している画面用の束（public/vendor）が、このソースと lockfile から作り直したものと 1 バイトも違わないこと
      - name: Vendored bundles match a rebuild from source
        run: |
          npm run -s build:login
          git diff --exit-code --stat -- public/vendor
          test -z "$(git status --porcelain -- public/vendor)"
      # 利用者の画面と Worker に入る部品（dependencies）に、高い以上の既知の弱点が無いこと。
      # 開発だけで使う部品（wrangler・playwright など）は表に出すだけで止めない
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || echo "::warning::devDependencies に既知の弱点がある（上の表）"
      - run: npm test
      # 管理の道具の試験はポスターを縮める（Pillow。取得のジョブと同じ）
      - run: python3 -m pip install --quiet pillow
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: npx wrangler deploy --dry-run --outdir /tmp/taguri-worker
      - run: npx wrangler d1 migrations apply taguri-demo --local
      - run: node test/runtime-smoke.js
      - run: python3 scripts/visual_fixtures.py /tmp/taguri-visual-fixtures.json
      - run: npx playwright install --with-deps chromium
      - run: node test/visual-check.js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: original-and-restored-ui
          path: /tmp/taguri-visual/*.png
