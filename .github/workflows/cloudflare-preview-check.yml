name: Check Cloudflare migration preview
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Build original Python source and synthetic public input
        run: |
          python3 scripts/build_python_bundle.py
          python3 scripts/build_public_snapshot.py --catalogue test/synthetic-public-catalogue.jsonl --approved-base-recommendation test/synthetic-public-base.json --output python/python_modules/public_snapshot.py
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: npx wrangler deploy --dry-run --outdir /tmp/taguri-worker
      - run: npx wrangler d1 migrations apply taguri-demo --local
      - run: node test/runtime-smoke.js
      - run: python3 scripts/visual_fixtures.py /tmp/taguri-visual-fixtures.json
      - run: npx playwright install --with-deps chromium
      - run: node test/visual-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-and-restored-ui
          path: /tmp/taguri-visual/*.png
