name: Catalog age

# 公開版の公演カタログが古くなっていないかを毎日確かめる（tools/taguri/check_catalog_age.py）。
# EC2 が無く、毎日の作り直しが止まっているかもしれないため（docs/knowledge の no-ec2・q-catalog-source）。
# 失敗するとリポジトリの持ち主に GitHub から通知が届く。見るのは公開の /api/health の日付と件数だけ。
# **毎日の自動実行は止めている。** AWS を使わなくなり（no-aws）、Render のデモ版が読む S3 の
# カタログはもう更新されないため、毎日失敗の通知が届くだけになる。Cloudflare 版がカタログの日付を
# 返すようになったら、その URL で再開する（q-catalog-to-worker）。手動では今も動かせる。
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'health の URL'
        required: false
        default: 'https://taguri-demo.onrender.com/api/health'
      max_days:
        description: 'これより古ければ失敗（日）'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the catalog age on the public server
        # 入力は環境変数で渡す（シェルの文字列に直接埋め込まない）
        env:
          HEALTH_URL: ${{ github.event.inputs.url || 'https://taguri-demo.onrender.com/api/health' }}
          MAX_DAYS: ${{ github.event.inputs.max_days || '3' }}
        run: python tools/taguri/check_catalog_age.py --url "$HEALTH_URL" --max-days "$MAX_DAYS"
