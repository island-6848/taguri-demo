name: Recommendation feedback loop

on:
  push:
    paths:
      - 'tools/review/**'
      - 'tools/taguri/**'
      - '.github/workflows/recommendation-loop.yml'
  pull_request:
    paths:
      - 'tools/review/**'
      - 'tools/taguri/**'
      - '.github/workflows/recommendation-loop.yml'

permissions:
  contents: read

jobs:
  feedback-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: User feedback, isolation, and HTTP regressions
        run: python tools/taguri/test_user_recommendation.py
      - name: Demo seed data
        run: python tools/taguri/test_seed_demo.py
      - name: Reaction buckets
        run: python tools/taguri/test_rebucket.py
      - name: Authentication
        run: python tools/taguri/test_auth.py
