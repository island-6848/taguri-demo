name: Recommendation feedback loop

on:
  push:
    paths:
      - 'deploy/**'
      - 'tools/lib/**'
      - 'tools/tickets/**'
      - 'tools/review/**'
      - 'tools/taguri/**'
      - '.github/workflows/recommendation-loop.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'tools/lib/**'
      - 'tools/tickets/**'
      - 'tools/review/**'
      - 'tools/taguri/**'
      - '.github/workflows/recommendation-loop.yml'

permissions:
  contents: read

jobs:
  feedback-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Blueprint validation tools
        run: python -m pip install PyYAML jsonschema
      - name: Validate service Blueprint against official Render schema
        run: |
          python - <<'PYSCHEMA'
          import json
          import urllib.request
          import yaml
          import jsonschema
          with urllib.request.urlopen("https://render.com/schema/render.yaml.json", timeout=30) as response:
              schema = json.load(response)
          with open("deploy/render-service.yaml", encoding="utf-8") as source:
              blueprint = yaml.safe_load(source)
          jsonschema.Draft202012Validator(schema).validate(blueprint)
          print("Service Blueprint conforms to the current official Render schema")
          PYSCHEMA
      - name: User feedback, isolation, and HTTP regressions
        run: python tools/taguri/test_user_recommendation.py
      - name: State persistence, catalog safety, and operational logs
        run: python tools/taguri/test_cloud_storage.py
      - name: Offline state backup and restore
        run: python tools/taguri/test_state_backup.py
      - name: Service export privacy and persistence guards
        run: python tools/taguri/test_service_release.py
      - name: Demo seed data
        run: python tools/taguri/test_seed_demo.py
      - name: Reaction buckets
        run: python tools/taguri/test_rebucket.py
      - name: Authentication
        run: python tools/taguri/test_auth.py
      - name: Polite fetching (robots.txt, intervals, back-off)
        run: python tools/lib/test_polite_http.py
      - name: Catalog publishing and live refresh
        run: python tools/taguri/test_catalog_publish.py
      - name: Shared favourite names for all users
        run: python tools/taguri/test_shared_favourites.py
      - name: Search requests for shows not in the catalog
        run: python tools/taguri/test_search_requests.py
      - name: Demo seed records feed recommendations
        run: python tools/taguri/test_demo_seed_links.py
      - name: Public demo HTTP regressions
        run: python tools/taguri/test_demo_stability.py
      - name: Demo and service editions stay separate
        run: python tools/taguri/test_editions.py

      - name: Catalog dates on the public health endpoint
        run: python tools/taguri/test_catalog_info.py
      - name: Crawler working data between runs
        run: python tools/taguri/test_crawler_state.py
      - name: Candidates from the CoRich sitemap (search page refused from data centers)
        run: python tools/review/test_fetch_candidates_sitemap.py
