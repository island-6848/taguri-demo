name: Deploy web/ to GitHub Pages

# #000009: GitHub Pages移行。web/ 配下の静的フロントエンド(index.html・app.js・
# style.css・vendor/)をPagesにデプロイする。docs/からはプレゼン資料のHTML 1枚だけを
# 添える(READMEから直接開けるように)。使用者向けの使い方ガイド(000010)も同じ扱い。設計ドキュメントや
# tools/(Renderで動くAPIサーバ本体)はここでは触らない。

on:
  push:
    branches: ["main", "master"]
    paths: ["web/**", "docs/000003-final-presentation-taguri.html", "docs/000010-user-guide-taguri.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # web/ にプレゼン資料だけを足した公開用フォルダを作る
      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -r web/. _site/
          cp docs/000003-final-presentation-taguri.html _site/docs/
          cp docs/000010-user-guide-taguri.html _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
