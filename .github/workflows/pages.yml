name: Deploy web/ to GitHub Pages

# #000009: GitHub Pages移行。デモ版とサービス版の2つの入口を同じサイトに置く（下の Assemble site）。web/ 配下の静的フロントエンド(index.html・app.js・
# style.css・vendor/)をPagesにデプロイする。docs/からはプレゼン資料のHTML 1枚だけを
# 添える(READMEから直接開けるように)。使用者向けの使い方ガイド(000010)も同じ扱い。設計ドキュメントや
# tools/(Renderで動くAPIサーバ本体)はここでは触らない。

on:
  push:
    branches: ["main", "master"]
    paths: ["web/**", "docs/000003-final-presentation-taguri.html", "docs/000010-user-guide-taguri.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # web/ にプレゼン資料だけを足した公開用フォルダを作る
      # デモ版（/taguri-demo/）とサービス版（/taguri-demo/app/）は同じ画面のファイルを使い、
      # つなぐAPIサーバーだけを変える（web/config.js・docs/editions.md）。サービス版の
      # サーバーのURLはリポジトリの変数 TAGURI_SERVICE_API に入れる。未設定なら「準備中」を出す
      - name: Assemble site
        env:
          TAGURI_SERVICE_API: ${{ vars.TAGURI_SERVICE_API }}
        run: |
          mkdir -p _site/docs _site/app
          cp -r web/. _site/
          case "$TAGURI_SERVICE_API" in
            https://*) ;;
            "") ;;
            *) echo "TAGURI_SERVICE_API must start with https://" >&2; exit 1 ;;
          esac
          sed -i "s#__TAGURI_SERVICE_API__#${TAGURI_SERVICE_API}#" _site/config.js
          cp _site/index.html _site/app/index.html
          # 深い URL（/taguri-demo/recommend など）を読み込み直すと、GitHub Pages は 404.html を返す。
          # これが古い写しだと、読み込み直したときだけ昔の見た目が出る（起案者の指摘 2026-10-14）ので、
          # 毎回 index.html から作り直す
          cp _site/index.html _site/404.html
          cp docs/000003-final-presentation-taguri.html _site/docs/
          cp docs/000010-user-guide-taguri.html _site/docs/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
