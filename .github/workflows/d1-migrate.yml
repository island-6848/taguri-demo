name: Apply D1 migrations

# 本番のD1（taguri-demo）に cloudflare/migrations/ の未適用分を入れる。
#
# - cloudflare-d1-preview はCloudflareのWorkers Buildsが本番として反映する
#   ブランチなので、そこで移行ファイルが変わったら自動で適用し、コードとD1を揃える。
# - workflow_dispatch はこのファイルがmasterに入ってから「Run workflow」ボタンで使える。
# - pull_request では走らせない（PRの内容で本番のD1を変えない）。
#
# 必要なもの: リポジトリのSecret CLOUDFLARE_API_TOKEN（権限は Account / D1 / Edit だけ）。
# 適用済みの移行は wrangler が記録しているので、何度走らせても同じものは2度入らない。
on:
  push:
    branches: [cloudflare-d1-preview]
    paths:
      - 'cloudflare/migrations/**'
      - '.github/workflows/d1-migrate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 公開されている値（Workers Buildsのログのリンクにも出ている）。秘密ではない
      CLOUDFLARE_ACCOUNT_ID: e03256e9248f40014442896755e0c98b
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN が未登録です。Settings → Secrets and variables → Actions で登録してから Re-run してください。"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund wrangler@4
      - name: Pending migrations
        run: npx wrangler d1 migrations list taguri-demo --remote
      - name: Apply
        run: npx wrangler d1 migrations apply taguri-demo --remote
      - name: After
        run: npx wrangler d1 migrations list taguri-demo --remote
