# 非公開リポジトリ（island-6848/taguri-crawler）の .github/workflows/catalog.yml に置く。
# 公開リポジトリ（taguri-demo）のコードを取り出して公演カタログを取り直し、
# 作業データをこの非公開リポジトリの state ブランチに書き戻す。AWS は使わない（no-aws）。
# 非公開リポジトリで動かすのは、実行ログや作業データに公演の題名などが出ても外から見えないようにするため
# （docs/knowledge の dec-crawler-gha-private・gha-public-logs）。
#
# **無料枠の中だけで動かす**（起案者の指示「必ず無料の範囲内にして。絶対超えないで」、docs/free-tier-budget.md）。
# 非公開リポジトリの Actions は月 2,000 分まで無料。最初の段（Plan within the free tier）が直近 31 日の分数を
# GitHub の API で数え、上限 1,500 分に収まるときだけ動かし、過去の公演を読む分数を決める
# （cloudflare/scripts/free_tier.py）。D1・R2 に入れる段も、それぞれの上限の手前で止まる。
# 最後の段（Free-tier check）が使った量を表にし、上限の 8 割を越えたら失敗して持ち主に通知が届く。
# 過去の公演の一覧（q-auto-link-past）は、別のワークフローにすると準備と書き戻しで毎日 10 分ほど
# 余計にかかるので、このジョブの中で読む（以前の past-stages.yml はやめた）。
name: Catalog

on:
  schedule:
    # 日本時間 4:17。月〜土は毎日の更新、日曜は候補・クレジットまで取り直す（毎時 0 分は混むので避ける）
    - cron: '17 19 * * 0-5'
    - cron: '17 19 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily・weekly・index（初回は weekly）。index は推薦の索引だけを入れる（取り直し・ポスター・過去の公演はしない。q-index-load-now）'
        required: false
        default: 'weekly'

# 2 本同時に走らせない（作業データを取り合わない）。走っている方は止めない
concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write   # state ブランチへの書き戻しに使う
  actions: read     # 無料枠の点検で、このリポジトリのジョブの分数を読む

jobs:
  build:
    runs-on: ubuntu-latest
    # ジョブの上限（最後の歯止め）。ふだんの長さは Plan の段が決める
    timeout-minutes: 300
    env:
      # あらすじは LLM を呼ばずに読み取り待ち（data/credits/synopsis_queue.jsonl）へ書き出す。
      # 読むのは起案者の Claude の定期実行（docs/knowledge の dec-synopsis-reader-claude）。
      # Gemini API は利用者の感想を読むときだけに使うので、ここでは鍵を渡さない
      TAGURI_THEME_READER: 'queue'
      # CoRich の検索ページはデータセンターからの接続を断るので使わない。新しい公演はサイトマップで見つける
      # （docs/knowledge の corich-search-waf-403・dec-corich-sitemap）
      TAGURI_CORICH_SEARCH: 'off'
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '17 19 * * 6' && 'weekly') || 'daily' }}
    steps:
      - name: Check out the public code
        uses: actions/checkout@v5
        with:
          repository: island-6848/taguri-demo
          ref: master
      - name: Check out the previous working data (state branch)
        id: state
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: state
          path: state
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Pin wrangler to the version in cloudflare/package-lock.json
        # 本番の鍵を持って動く wrangler を、その時いちばん新しい 4 系ではなく lockfile の版にする（taguri-demo の issue #131）。
        # 取ってくるのは wrangler 自身の版を名指しで（npm ci はしない。毎日 30 秒ほど増えるため）
        run: echo "WRANGLER=wrangler@$(node -p "require('./cloudflare/package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_ENV"
      - name: Install Pillow (posters are shrunk before they go into R2)
        # ポスターを縮めてから R2 に入れる（起案者の指示 2026-10-14「ポスターはちょっと画質落としてから入れて」）。
        # 無いと縮めずに入れてしまい、R2 の無料枠を早く使う（2026-10-14 まで 1 枚 約 440 KB で入っていた）
        run: python -m pip install --quiet pillow
      - name: Restore the previous working data
        run: |
          if [ "${{ steps.state.outcome }}" != "success" ]; then
            echo "state ブランチがまだ無い。初回なので週 1 の取り直しで始める"
            echo "MODE=weekly" >> "$GITHUB_ENV"
            rm -rf state
          fi
          python tools/taguri/crawler_state.py restore --from state
      - name: Plan within the free tier
        # 直近 31 日の分数が上限に届く見込みなら、ここで失敗して何もしない（通知が届く）。
        # 週 1 の分が無ければ毎日の更新だけにし、過去の公演を読む分数（0 もある）を決める
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python cloudflare/scripts/free_tier.py plan --data data --mode "$MODE"
      - name: Rebuild the catalog
        if: steps.plan.outputs.mode != 'index'
        timeout-minutes: ${{ fromJSON(steps.plan.outputs.catalog_minutes) }}
        run: python tools/taguri/publish_catalog.py --mode "${{ steps.plan.outputs.mode }}" --dry-run --out catalog.tar.gz
      - name: Queue the synopses of new stages (cached pages only, every day)
        # あらすじの読み取り待ち（data/credits/synopsis_queue.jsonl）を毎日足す（起案者の指摘 2026-10-16
        # 「あらすじ取れないと興味ありなしの推薦の意味ない」）。これまでは週 1 の取り直しの中だけで作っていたので、
        # 待ちが一度も出ず、あらすじは 0 件だった。ここは手元に控えたページだけを使い（--no-fetch）、取得も LLM も
        # 呼ばない（数十秒）。読むのは起案者の Claude の定期実行（docs/knowledge の dec-synopsis-reader-claude）
        if: steps.plan.outputs.mode == 'daily'
        continue-on-error: true
        timeout-minutes: 10
        env:
          TAGURI_THEME_READER: 'queue'
        run: python tools/credits/extract_theme_llm.py --side candidate --no-fetch
      - name: Deliver the catalogue to D1 (changed rows only)
        if: steps.plan.outputs.run == 'true'
        # 公演一覧と、一度だけ読んだあらすじを本番の D1 に入れる（cloudflare/scripts/deliver_catalogue.py）。
        # 変わった行だけを書く（D1 の無料枠は 1 日 10 万行の書き込み）。鍵はこの段にだけ渡す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の鍵が無いので D1 には入れない"; exit 0
          fi
          # wrangler の出力を <ファイル>.log に残し、commit が D1 の数（rows_written）で控えを直す（d1-upsert-counts）。
          # tee を挟んでも wrangler の失敗で止まるように pipefail
          set -o pipefail
          # index のときは推薦の索引だけ（その日の予算をまるごと索引に回す。公演一覧・題名・カードは毎日の実行で）
          only=""; [ "${{ steps.plan.outputs.mode }}" = "index" ] && only="--index-only"
          python scripts/deliver_catalogue.py build --data ../data --out ../d1-out --index $only
          if [ -s ../d1-out/catalogue.sql ]; then
            npx --yes "$WRANGLER" d1 execute taguri-demo --remote --yes --file ../d1-out/catalogue.sql 2>&1 | tee ../d1-out/catalogue.sql.log
          fi
          # 索引は 1 MB ずつに分けてある（index-upload-01.sql …、7009 で止まらないように）。名前の順に送る
          for f in $(cd ../d1-out && ls index-upload-*.sql 2>/dev/null) labels-upload.sql cards-upload.sql; do
            if [ -f "../d1-out/$f" ]; then
              npx --yes "$WRANGLER" d1 execute taguri-demo --remote --yes --file "../d1-out/$f" 2>&1 | tee "../d1-out/$f.log"
            fi
          done
          # 入れ終えてから「入れた」と記録する（失敗した分は次回まるごと入れ直す）
          python scripts/deliver_catalogue.py commit --data ../data --out ../d1-out
      - name: Fetch posters of past stages (newest first)
        # 過去の公演（2019 年以降）のポスター（起案者の指示 2026-10-16「過去の公演の全てのポスターデータも欲しい」）。
        # taguri-demo の tools/taguri/posters.py --past。ページは 1 公演 1 回だけ読み直して画像の URL を控え、
        # 画像は 1.1 秒に 1 枚（polite_http）。分数は Plan の段が無料枠から決める（0 の日は取らない）。
        # 取ったものは次の段で R2 に入る（無料枠の控えを見て、入れられる分だけ）。失敗しても先へ進む
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.mode != 'index' && steps.plan.outputs.poster_minutes != '0'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.plan.outputs.poster_timeout) }}
        run: python tools/taguri/posters.py --past --max-minutes "${{ steps.plan.outputs.poster_minutes }}"
      - name: Upload posters to R2 (new ones only)
        # 取り込んだポスターを R2 に移し、D1 の poster 表に載せる（cloudflare/scripts/deliver_posters.py）。
        # R2 は無料枠を越えると請求が来るので、保存 8 GB・月 30 万回の手前で止まる（free_tier.py）。
        # R2 に入れ終えた分は作業データから外れる（crawler_state.py）。鍵に R2 の権限が無いか、
        # バケットが無いときは何も変えずに先へ進む（ポスターは今までどおり作業データに残る）
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.mode != 'index'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の鍵が無いので R2 には入れない"; exit 0
          fi
          python scripts/deliver_posters.py build --data ../data --out ../d1-posters
          if [ -f ../d1-posters/posters-upload.sql ]; then
            npx --yes "$WRANGLER" d1 execute taguri-demo --remote --yes --file ../d1-posters/posters-upload.sql
          fi
          python scripts/deliver_posters.py commit --data ../data --out ../d1-posters
      - name: Read past stage pages (2019 onwards, newest first)
        # 過去の公演の一覧（q-auto-link-past）。1.1 秒に 1 枚（polite_http）。読む枚数と分数は Plan の段が
        # 無料枠から決める（起案者の「1 日 6,000 件」は、無料枠に収まる分だけにした。free-tier-budget.md）
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.past_minutes != '0' && steps.plan.outputs.mode != 'index'
        timeout-minutes: ${{ fromJSON(steps.plan.outputs.past_timeout) }}
        run: |
          python tools/review/fetch_past_stages.py --limit "${{ steps.plan.outputs.past_limit }}" \
            --since 2019-01-01 --max-minutes "${{ steps.plan.outputs.past_minutes }}"
          python tools/review/fetch_past_stages.py --report | head -20
      - name: Deliver the new past stages to D1 (past_stage)
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.mode != 'index'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の鍵が無いので D1 には入れない"; exit 0
          fi
          python scripts/deliver_past.py build --data ../data --out ../d1-past
          if [ -f ../d1-past/past-upload.sql ]; then
            npx --yes "$WRANGLER" d1 execute taguri-demo --remote --yes --file ../d1-past/past-upload.sql
          fi
          python scripts/deliver_past.py commit --data ../data --out ../d1-past
      - name: Put the name index of the past stages into R2 (changed files only)
        # お気に入りのハッシュタグの画面が、名前から過去の公演を引くための索引（taguri-demo の
        # cloudflare/scripts/deliver_past_index.py、docs/knowledge の dec-past-name-index）。
        # 名前で 256 個に分けた JSON を R2 に置き、中身が変わったものだけ送る（ふだんは 1 日 256 回まで）。
        # R2 の保存と書き込み回数は free_tier.py の控えで数え、上限の手前で止まる。失敗しても先へ進む
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.mode != 'index'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare の鍵が無いので R2 には入れない"; exit 0
          fi
          if [ ! -f scripts/deliver_past_index.py ]; then
            echo "taguri-demo にまだ deliver_past_index.py が無い"; exit 0
          fi
          python scripts/deliver_past_index.py --data ../data || echo "名前の索引は入れられなかった（画面は D1 の一覧で代わりに探す）"
      - name: Back up the user records (encrypted, 30 days in R2)
        # 利用者の記録の表だけを書き出し、行数を D1 と比べてから gpg（AES-256）で暗号化して R2 の
        # backup/d1/ に置く。30 日より古いものは消す（cloudflare/scripts/backup_d1.py、S31）。
        # 合言葉 BACKUP_PASSPHRASE が無ければ何もしない。失敗しても取得の結果の保存は続ける。
        # 雛形（taguri-demo の tools/taguri/deploy/github-actions/catalog.yml）にはあったが、ここに入っていなかった（2026-10-18 に足した）
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.mode != 'index'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python cloudflare/scripts/backup_d1.py backup --data data
      - name: Free-tier check
        # 使った量（Actions の分・D1 の書き込み・R2 の保存と回数・Worker の R2 の読み出し）を表にする。
        # 上限の 8 割を越えたか、読めなかったら失敗する（GitHub から持ち主に通知が届く）
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            (cd cloudflare && npx --yes "$WRANGLER" d1 execute taguri-demo --remote --json \
              --command "SELECT k, n FROM usage" > ../worker-usage.json) || echo "Worker の数えが読めなかった"
          fi
          python cloudflare/scripts/free_tier.py check --data data --d1-usage worker-usage.json
      # 失敗しても、そこまでの取得の控えは残す（次回に同じものを取り直さない）
      - name: Save the working data to the state branch
        if: always() && steps.plan.outputs.run == 'true'
        run: |
          rm -rf state && mkdir state && cd state
          git init -q -b state
          cd ..
          python tools/taguri/crawler_state.py save --to state
          cd state
          git config user.name "taguri-crawler"
          git config user.email "taguri-crawler@users.noreply.github.com"
          git add -A
          git commit -q -m "作業データ $(date -u +%Y-%m-%dT%H:%MZ) (${{ steps.plan.outputs.mode }})"
          # 履歴は持たない（毎回 1 コミットだけの state で置き換え、リポジトリが膨らまないようにする）
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state:state
