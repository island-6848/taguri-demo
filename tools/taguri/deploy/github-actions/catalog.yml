# 非公開リポジトリ（island-6848/taguri-crawler）の .github/workflows/catalog.yml に置く。
# 公開リポジトリ（taguri-demo）のコードを取り出して、公演カタログを取り直し、非公開の S3 に載せる。
# 非公開リポジトリで動かすのは、実行ログに公演の題名などが出ても外から見えないようにするため
# （docs/knowledge の dec-crawler-gha-private・gha-public-logs）。
name: Catalog

on:
  schedule:
    # 日本時間 4:17。月〜土は毎日の更新、日曜は候補・クレジットまで取り直す（毎時 0 分は混むので避ける）
    - cron: '17 19 * * 0-5'
    - cron: '17 19 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily か weekly'
        required: false
        default: 'daily'

# 2 本同時に走らせない（作業データを取り合わない）。走っている方は止めない
concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
      STAGE_CATALOG_BUCKET: ${{ secrets.STAGE_CATALOG_BUCKET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '17 19 * * 6' && 'weekly') || 'daily' }}
    steps:
      - name: Check out the public code
        uses: actions/checkout@v4
        with:
          repository: island-6848/taguri-demo
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install boto3
        run: python -m pip install --quiet boto3
      - name: Restore the previous working data
        run: python tools/taguri/crawler_state.py restore
      - name: Rebuild and publish the catalog
        run: python tools/taguri/publish_catalog.py --mode "$MODE"
      # 失敗しても、そこまでの取得の控えは残す（次回に同じものを取り直さない）
      - name: Save the working data
        if: always()
        run: python tools/taguri/crawler_state.py save
