<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>ログイン ― たぐり</title>
<link rel="stylesheet" href="/migration-data/style.css">
<header><h1>たぐり</h1><p>観た舞台を、次の楽しみへ。</p></header>
<main>
<section>
<h2>ログイン</h2>
<p>パスワードは使いません。Google アカウントか、メールに届くリンクでログインします。たぐりが保存するのはログインの識別番号だけで、メールアドレスは保存しません。</p>
<p><button id="google" type="button">Google でログイン</button></p>
<form id="email-form"><label>メールアドレス<input id="email" type="email" required autocomplete="email" maxlength="254"></label><button>ログイン用のリンクを送る</button></form>
<p id="status" role="status" aria-live="polite"></p>
<p>復旧コードで使っている方も、ここでログインすると、これまでの記録を引き継げます（復旧コードでログインしたままの状態で押してください）。</p>
</section>
</main>
<script type="module" src="/vendor/firebase-login.js"></script>
</html>
